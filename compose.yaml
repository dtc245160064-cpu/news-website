services:
  db:
    image: mysql:8.4
    container_name: news-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: news-mysql-exporter
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    command:
      - "--mysqld.address=db:3306"
      - "--mysqld.username=exporter"
    networks:
      - frontend
      - backend
  wordpress:
    image: wordpress:latest
    container_name: news-wordpress
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - frontend
      - backend

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: news-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - frontend
      - backend

  nginx:
    image: nginx:alpine
    container_name: news-nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: news-nginx-exporter
    restart: unless-stopped
    depends_on:
      - nginx
    command:
      - "--nginx.scrape-uri=http://nginx/nginx_status"
    networks:
      - frontend
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: news-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: news-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - frontend

  grafana:
    image: grafana/grafana:latest
    container_name: news-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - frontend

volumes:
  db_data:
  wordpress_data:
  prometheus_data:
  grafana_data:

networks:
  frontend:
  backend:
    internal: true
